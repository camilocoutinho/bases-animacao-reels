<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>03 · Pergunta e resposta</title>
  <!-- Copyright (c) 2026 Camilo Coutinho. Licença MIT. Veja LICENSE na raiz do repositório. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Domine:wght@500;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Troque só estas cores e fontes. Salve e atualize o navegador. */
    :root {
      --fundo: #111111;
      --texto: #ffffff;
      --destaque: #99ca3d;
      --fonte: "Montserrat", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      --fonte-display: "Domine", Georgia, "Times New Roman", serif;
    }

    html, body { margin: 0; height: 100%; background: #111111; }
    body { display: grid; place-items: center; overflow: hidden; }
    #caixa { position: relative; }
    #palco {
      width: 1080px;
      height: 1920px;
      position: absolute;
      left: 0;
      top: 0;
      transform-origin: top left;
      overflow: hidden;
      background: var(--fundo);
      color: var(--texto);
      font-family: var(--fonte);
    }

    .miolo {
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 88px;
      box-sizing: border-box;
      gap: 36px;
    }
    .linha {
      margin: 0;
      font-size: 64px;
      line-height: 1.25;
      min-height: 1.25em;
    }
    #resposta { color: var(--destaque); font-family: var(--fonte-display); font-size: 72px; font-weight: 700; }
    #cursor {
      display: inline-block;
      width: 18px;
      height: 0.9em;
      background: var(--destaque);
      transform: translateY(6px);
      margin-left: 6px;
    }
  </style>
</head>
<body>
  <div id="caixa">
    <div id="palco">
      <div class="miolo">
        <p class="linha"><span id="pergunta"></span><i id="cursor"></i></p>
        <p class="linha" id="resposta"></p>
      </div>
    </div>
  </div>
  <script>
    function encaixa() {
      var s = Math.min(window.innerWidth / 1080, window.innerHeight / 1920);
      var palco = document.getElementById("palco");
      var caixa = document.getElementById("caixa");
      palco.style.transform = "scale(" + s + ")";
      caixa.style.width = (1080 * s) + "px";
      caixa.style.height = (1920 * s) + "px";
    }
    window.addEventListener("resize", encaixa);
    encaixa();

    var pergunta = "E se o gancho falhar?";
    var resposta = "Você corta de novo.";
    var elP = document.getElementById("pergunta");
    var elR = document.getElementById("resposta");
    var cursor = document.getElementById("cursor");
    var ciclo = 6000;

    function frame(agora) {
      var t = agora % ciclo;
      var nP = t < 2200 ? Math.floor(pergunta.length * (t / 2200)) : pergunta.length;
      var nR = 0;
      if (t >= 2500 && t < 4300) nR = Math.floor(resposta.length * ((t - 2500) / 1800));
      else if (t >= 4300) nR = resposta.length;
      elP.textContent = pergunta.slice(0, nP);
      elR.textContent = resposta.slice(0, nR);
      cursor.style.visibility = t < 2500 && Math.floor(t / 380) % 2 === 0 ? "visible" : "hidden";
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
