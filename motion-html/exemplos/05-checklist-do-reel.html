<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>05 · Checklist do Reel</title>
  <!-- Copyright (c) 2026 Camilo Coutinho. Licença MIT. Veja LICENSE na raiz do repositório. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Domine:wght@500;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Troque só estas cores e fontes. Salve e atualize o navegador. */
    :root {
      --fundo: #111111;
      --texto: #ffffff;
      --mudo: #c8c8c8;
      --destaque: #99ca3d;
      --fonte: "Montserrat", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      --fonte-display: "Domine", Georgia, "Times New Roman", serif;
    }

    html, body { margin: 0; height: 100%; background: #111111; }
    body { display: grid; place-items: center; overflow: hidden; }
    #caixa { position: relative; }
    #palco {
      width: 1080px;
      height: 1920px;
      position: absolute;
      left: 0;
      top: 0;
      transform-origin: top left;
      overflow: hidden;
      background: var(--fundo);
      color: var(--texto);
      font-family: var(--fonte);
    }

    .miolo {
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 96px;
      box-sizing: border-box;
    }
    h1 {
      margin: 0 0 56px;
      font-family: var(--fonte-display);
      font-weight: 700;
      font-size: 78px;
      line-height: 0.95;
      letter-spacing: -2px;
    }
    ul { list-style: none; margin: 0; padding: 0; }
    li {
      display: flex;
      align-items: center;
      gap: 28px;
      margin: 0 0 36px;
      font-size: 42px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    i {
      width: 58px;
      height: 58px;
      border: 4px solid var(--mudo);
      box-sizing: border-box;
      display: grid;
      place-items: center;
      flex: none;
    }
    i::after {
      content: "";
      width: 14px;
      height: 26px;
      border-right: 6px solid var(--destaque);
      border-bottom: 6px solid var(--destaque);
      margin-top: -6px;
      transform: rotate(40deg) scale(0);
    }
    li:nth-child(1) span { animation: c1 6s infinite; }
    li:nth-child(2) span { animation: c2 6s infinite; }
    li:nth-child(3) span { animation: c3 6s infinite; }
    li:nth-child(4) span { animation: c4 6s infinite; }
    li:nth-child(1) i::after { animation: v1 6s infinite; }
    li:nth-child(2) i::after { animation: v2 6s infinite; }
    li:nth-child(3) i::after { animation: v3 6s infinite; }
    li:nth-child(4) i::after { animation: v4 6s infinite; }

    @keyframes c1 {
      0%, 12% { color: var(--mudo); }
      20%, 90% { color: var(--texto); }
      100% { color: var(--mudo); }
    }
    @keyframes c2 {
      0%, 28% { color: var(--mudo); }
      36%, 90% { color: var(--texto); }
      100% { color: var(--mudo); }
    }
    @keyframes c3 {
      0%, 44% { color: var(--mudo); }
      52%, 90% { color: var(--texto); }
      100% { color: var(--mudo); }
    }
    @keyframes c4 {
      0%, 60% { color: var(--mudo); }
      68%, 90% { color: var(--texto); }
      100% { color: var(--mudo); }
    }
    @keyframes v1 {
      0%, 12% { transform: rotate(40deg) scale(0); }
      20%, 90% { transform: rotate(40deg) scale(1); }
      100% { transform: rotate(40deg) scale(0); }
    }
    @keyframes v2 {
      0%, 28% { transform: rotate(40deg) scale(0); }
      36%, 90% { transform: rotate(40deg) scale(1); }
      100% { transform: rotate(40deg) scale(0); }
    }
    @keyframes v3 {
      0%, 44% { transform: rotate(40deg) scale(0); }
      52%, 90% { transform: rotate(40deg) scale(1); }
      100% { transform: rotate(40deg) scale(0); }
    }
    @keyframes v4 {
      0%, 60% { transform: rotate(40deg) scale(0); }
      68%, 90% { transform: rotate(40deg) scale(1); }
      100% { transform: rotate(40deg) scale(0); }
    }
  </style>
</head>
<body>
  <div id="caixa">
    <div id="palco">
      <div class="miolo">
        <h1>Antes de postar</h1>
        <ul>
          <li><i></i><span>O rosto está no quadro</span></li>
          <li><i></i><span>O efeito tem hora para entrar</span></li>
          <li><i></i><span>Eu assisti o rascunho</span></li>
          <li><i></i><span>A legenda fica para o editor</span></li>
        </ul>
      </div>
    </div>
  </div>
  <script>
    function encaixa() {
      var s = Math.min(window.innerWidth / 1080, window.innerHeight / 1920);
      var palco = document.getElementById("palco");
      var caixa = document.getElementById("caixa");
      palco.style.transform = "scale(" + s + ")";
      caixa.style.width = (1080 * s) + "px";
      caixa.style.height = (1920 * s) + "px";
    }
    window.addEventListener("resize", encaixa);
    encaixa();
  </script>
</body>
</html>
